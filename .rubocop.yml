---
plugins: rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Lint:
  Exclude:
    - bin/*

# Don't force top level comments in every class
Style/Documentation:
  Enabled: false

# Safe navigation is not available in older ruby versions
Style/SafeNavigation:
  Enabled: false

# A good line length is 100 chars
Layout/LineLength:
  Max: 100
  AllowURI: true

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Max: 300

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'lib/zoho_hub/connection.rb'

Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - 'lib/zoho_hub/base_record.rb'

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - 'lib/zoho_hub/base_record.rb'
    - 'lib/zoho_hub/connection.rb'

Metrics/AbcSize:
  Max: 30
  Exclude:
    - 'lib/zoho_hub/base_record.rb'

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 10

Naming/AccessorMethodName:
  Exclude:
    - 'lib/zoho_hub/base_record.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/zoho_hub/coql.rb'
